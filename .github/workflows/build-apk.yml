name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug - Check file structure
        run: |
          echo "=== Root files ==="
          ls -la
          echo "=== Check www folder ==="
          ls -la www/ 2>/dev/null || echo "www/ NOT FOUND at root"
          echo "=== Check subfolders ==="
          find . -name "index.html" -type f 2>/dev/null || echo "No index.html found"

      - name: Fix file structure if needed
        run: |
          # If files are inside bonscan-mobile/ subfolder, move them to root
          if [ -d "bonscan-mobile" ]; then
            echo "Found bonscan-mobile subfolder, moving files to root..."
            mv bonscan-mobile/* .
            mv bonscan-mobile/.github . 2>/dev/null || true
            rm -rf bonscan-mobile
          fi
          # If www doesn't exist but html/css/js files are at root, create www
          if [ ! -d "www" ]; then
            echo "Creating www folder..."
            mkdir -p www/icons
            cp index.html www/ 2>/dev/null || true
            cp style.css www/ 2>/dev/null || true
            cp app.js www/ 2>/dev/null || true
            cp manifest.json www/ 2>/dev/null || true
            cp sw.js www/ 2>/dev/null || true
            cp -r icons/* www/icons/ 2>/dev/null || true
          fi
          echo "=== Final structure ==="
          ls -la
          ls -la www/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Clean and add Android platform
        run: |
          rm -rf android
          npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bonscan-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
